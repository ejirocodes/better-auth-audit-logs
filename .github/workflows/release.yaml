name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag $tag, package.json $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Build
        run: bun run build

      - name: Smoke-test the built package on Node
        run: node scripts/node-smoke.mjs

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Pack the published tarball
        run: npm pack

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
